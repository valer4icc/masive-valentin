<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script src="calculator.js"></script>
  </head>
  <body>
    <div class="calculator-container">
      <header>Tip Calculator</header>
      <div class="input-section">
        <label for="bill-amount">$</label>
        <input
          type="number"
          id="bill-amount"
          placeholder="56.32"
          value="56.32"
          min="0"
          step="0.01"
        />
      </div>
      <div class="tip-percentage-section">
        <span id="tip-percentage-display">25%</span>
        <input
          type="range"
          id="tip-percentage-slider"
          min="0"
          max="100"
          value="25"
        />
      </div>
      <div class="result-section tip-result">
        <span>Tip</span>
        <span id="tip-amount">$14.08</span>
      </div>
      <div class="result-section total-result">
        <span>Total</span>
        <span id="total-amount">$70.40</span>
      </div>
    </div>
  </body>
</html>
